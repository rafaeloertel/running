name: Enviar treinos ao Garmin

on:
  schedule:
    # todo domingo às 19:00 de Brasília (22:00 UTC): envia os próximos 14 dias
    - cron: "0 22 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "Quantos dias a partir de hoje"
        default: "14"
      week:
        description: "Ou uma semana específica do plano (1–52); deixe vazio para usar 'dias'"
        default: ""
      dry_run:
        description: "Só simular (não envia nada)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Enviar ao Garmin Connect
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          ARGS="--days ${{ github.event.inputs.days || '14' }}"
          if [ -n "${{ github.event.inputs.week }}" ]; then ARGS="--week ${{ github.event.inputs.week }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python tools/garmin_sync.py $ARGS
